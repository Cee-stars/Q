name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 本体は index.html に埋め込んだ 1 枚のスクリプト。
      # 壊れたまま出すと真っ白な画面になるので、取り出して構文を見る。
      - name: Check JavaScript syntax
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' index.html | sed '1d;$d' > /tmp/app.js
          test -s /tmp/app.js || { echo "index.html からスクリプトを取り出せなかった"; exit 1; }
          node --check /tmp/app.js
          node --check sw.js

      - name: Check manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
